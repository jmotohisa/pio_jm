[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

lib_deps =
    greiman/SSD1306Ascii @ ^1.3.5
    greiman/SdFat @ ^2.2.3
    mikalhart/tinyGPSPlus @ ^1.1.0
    paulstoffregen/MsTimer2
    arduino-libraries/SD
